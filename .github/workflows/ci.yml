name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format (Q1)
        run: uv run ruff format --check .

      - name: Lint (Q1)
        run: uv run ruff check .

      - name: Type check (Q2)
        run: uv run mypy

      - name: Tests (Q3)
        run: uv run pytest -q

      - name: Forbidden patterns (Q4)
        run: uv run python scripts/check_forbidden.py
